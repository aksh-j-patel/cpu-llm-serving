name: CI

# Proves on a clean machine that the image builds, the tests pass and the smoke test runs.
# The image is built with portable CPU flags (GGML_NATIVE=OFF -> AVX2/FMA, STREAM x86-64-v3)
# because cached layers may be reused on runners with different processors.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Build, test, smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MODELS_VOLUME: ./models   # bind mount instead of a named volume, so the cache step can save it
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (portable CPU flags)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cpu-llm-serving:dev
          build-args: |
            GGML_NATIVE=OFF
            STREAM_MARCH=x86-64-v3
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Environment
        run: docker compose run --rm -T bench make sysinfo

      - name: Unit tests and offline engine check
        run: docker compose run --rm -T bench make test

      - name: Check the model lock exists
        run: |
          test -f configs/models.lock.json || {
            echo "::error::configs/models.lock.json is missing. Run 'make lock-models' in the container and commit it."
            exit 1
          }

      - name: Restore model cache
        uses: actions/cache@v4
        with:
          path: models
          key: models-smoke-${{ hashFiles('configs/models.lock.json') }}

      - name: Smoke test
        run: docker compose run --rm -T bench make smoke

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-results
          path: results/raw/
          if-no-files-found: ignore