# Which model files to download. Exact revisions and hashes live in models.lock.json,
# generated by `make lock-models` and committed to git.
# Each model is downloaded into models/<key>/.

models:
  # Smoke test and speculative-decoding draft model
  qwen2.5-0.5b-hf:
    repo: Qwen/Qwen2.5-0.5B-Instruct
    files: [config.json, generation_config.json, model.safetensors, tokenizer.json,
            tokenizer_config.json, vocab.json, merges.txt]
  qwen2.5-0.5b-q4_k_m:
    repo: Qwen/Qwen2.5-0.5B-Instruct-GGUF
    files: [qwen2.5-0.5b-instruct-q4_k_m.gguf]

  # Main model: baseline (transformers) and llama.cpp precisions
  qwen2.5-1.5b-hf:
    repo: Qwen/Qwen2.5-1.5B-Instruct
    files: [config.json, generation_config.json, model.safetensors, tokenizer.json,
            tokenizer_config.json, vocab.json, merges.txt]
  qwen2.5-1.5b-f16:
    repo: Qwen/Qwen2.5-1.5B-Instruct-GGUF
    files: [qwen2.5-1.5b-instruct-fp16.gguf]
  qwen2.5-1.5b-q8_0:
    repo: Qwen/Qwen2.5-1.5B-Instruct-GGUF
    files: [qwen2.5-1.5b-instruct-q8_0.gguf]
  qwen2.5-1.5b-q4_k_m:
    repo: Qwen/Qwen2.5-1.5B-Instruct-GGUF
    files: [qwen2.5-1.5b-instruct-q4_k_m.gguf]

# Sets map to the reproduction tiers in docs/REPRODUCE.md. "@name" includes another set.
sets:
  smoke: [qwen2.5-0.5b-hf, qwen2.5-0.5b-q4_k_m]
  quick: ["@smoke", qwen2.5-1.5b-hf, qwen2.5-1.5b-q8_0, qwen2.5-1.5b-q4_k_m]
  full: ["@quick", qwen2.5-1.5b-f16]
